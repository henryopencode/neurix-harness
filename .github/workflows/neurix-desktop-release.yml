name: Neurix stable desktop release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      validation_only:
        description: 'Build test installers without changing versions, tags, or Releases'
        type: boolean
        default: true
      target:
        description: 'Validation platform; publication always builds every platform'
        type: choice
        options: [all, win-x64, mac-arm64, mac-x64, linux-x64]
        default: all
      version:
        description: 'Optional stable version; otherwise start at 1.0.0 and increment the patch'
        type: string
        default: ''

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'
  DSH_COVERAGE_TEST_TIMEOUT_MS: '90000'

jobs:
  version:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.validation_only || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version || steps.validation.outputs.version }}
      tag: ${{ steps.release.outputs.tag || steps.validation.outputs.tag }}
      commit: ${{ steps.release.outputs.commit || steps.validation.outputs.commit }}
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reserve stable version and immutable tags
        if: github.event_name != 'workflow_dispatch' || !inputs.validation_only
        id: release
        env:
          RELEASE_SOURCE: ${{ github.sha }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: pnpm exec tsx scripts/release/desktop-stable.ts --version "$REQUESTED_VERSION"
      - name: Select validation source without publication
        if: github.event_name == 'workflow_dispatch' && inputs.validation_only
        id: validation
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json','utf8')); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version='+p.version+'\ntag=validation-'+process.env.GITHUB_RUN_ID+'\ncommit='+process.env.SOURCE_COMMIT+'\n');"
      - name: Select build platforms
        id: platforms
        env:
          VALIDATION_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_only && inputs.target || 'all' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const platforms = JSON.parse(fs.readFileSync('.github/desktop-targets.json', 'utf8'))
          const target = process.env.VALIDATION_TARGET
          const include = target === 'all' ? platforms : platforms.filter(platform => platform.target === target)
          if (include.length === 0) throw new Error('Unknown validation platform')
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'matrix=' + JSON.stringify({ include }) + '\n')
          NODE

  package:
    needs: version
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      DSH_DESKTOP_PACKAGE_CACHE_DIR: ${{ github.workspace }}/.desktop-package-cache
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Prepare Linux tools
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools libfuse2t64 libgtk-3-0 libnss3 libasound2t64
      - uses: actions/cache@v6.1.0
        with:
          path: .desktop-package-cache
          key: desktop-${{ matrix.target }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/primary-runtime/lock.json') }}
          restore-keys: desktop-${{ matrix.target }}-
      - run: pnpm install --frozen-lockfile
      - name: Build and verify installer
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: pnpm --dir apps/desktop exec tsx scripts/package-target.ts "$env:RELEASE_TARGET" --unsigned
      - name: Verify update discovery, transfers and installation handoff
        run: >-
          pnpm exec vitest run
          apps/desktop/tests/github-release-downloads.spec.ts
          apps/desktop/tests/github-release-installer.spec.ts
          apps/desktop/tests/github-release-replacement.spec.ts
          apps/desktop/tests/update-schedule.spec.ts
          apps/desktop/tests/update-coordinator.spec.ts
          scripts/release/desktop-stable.spec.ts
      - name: Verify server update admission and rollback
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          python3 -m unittest scripts/deploy/test_server_update.py
          node --test scripts/deploy/server-update-control.test.mjs
      - name: Package Linux Web server runtime
        if: matrix.target == 'linux-x64'
        run: node scripts/release/package-linux-server.mjs
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: neurix-${{ needs.version.outputs.tag }}-${{ matrix.target }}
          path: |
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*.exe
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*.dmg
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*.AppImage
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*-server.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name != 'workflow_dispatch' || !inputs.validation_only
    needs: [version, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: neurix-${{ needs.version.outputs.tag }}-*
          path: release-assets
          merge-multiple: true
      - name: Publish complete platform set
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd release-assets
          for asset in \
            "neurix-harness-$RELEASE_VERSION-win-x64-unsigned.exe" \
            "neurix-harness-$RELEASE_VERSION-mac-arm64-unsigned.dmg" \
            "neurix-harness-$RELEASE_VERSION-mac-x64-unsigned.dmg" \
            "neurix-harness-$RELEASE_VERSION-linux-x86_64-unsigned.AppImage" \
            "neurix-harness-$RELEASE_VERSION-linux-x64-server.tar.gz"; do
            test -s "$asset"
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 5
          sha256sum -- *.exe *.dmg *.AppImage *.tar.gz > SHA256SUMS.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const assets = fs.readdirSync('.').map(name => ({ name, size: fs.statSync(name).size }))
          fs.writeFileSync('desktop-update.json', JSON.stringify({
            tag_name: process.env.RELEASE_TAG, draft: false, prerelease: false, assets,
          }) + '\n')
          NODE
          printf '%s\n' 'Windows x64, macOS Apple Silicon, macOS Intel, and Linux x64 installers.' \
            '' 'Windows installers are unsigned. macOS installers use ad-hoc signing without notarization.' \
            'These downloads do not use the upstream automatic-update service.' > ../release-notes.md
          printf '\nSource: `%s`\nBuild and update checks: %s/%s/actions/runs/%s\n' \
            "$RELEASE_COMMIT" "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_RUN_ID" >> ../release-notes.md
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > ../release-is-draft; then
            if test "$(cat ../release-is-draft)" != true; then
              echo 'This immutable release is already published.'
              exit 0
            fi
            gh release upload "$RELEASE_TAG" --clobber -- ./*
          else
            gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_COMMIT" --draft \
              --title "Neurix Harness $RELEASE_TAG" --notes-file ../release-notes.md -- ./*
          fi
          # Draft releases are discoverable in the list before tag lookup can resolve them.
          release_id=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" --silent -F draft=false -f make_latest=legacy
