name: Neurix development checks

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: neurix-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'
  # Inline Vitest projects use the repository's existing CI test and hook budget.
  DSH_COVERAGE_TEST_TIMEOUT_MS: '90000'

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Prepare confined execution backend
        run: bash scripts/prepare-ci-bubblewrap.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run lint
      - name: Verify server update admission and rollback
        run: |
          node --test scripts/deploy/server-update-control.test.mjs
          python3 -m unittest discover -s scripts/deploy -p 'test_server_update.py' -v
      - run: pnpm run test
