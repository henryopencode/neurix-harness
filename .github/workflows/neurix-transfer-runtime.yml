name: Transfer verified Neurix server runtime

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Linux validation run whose server archive should be transferred'
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: neurix-validation-${{ inputs.run_id }}-linux-x64
          path: runtime
      - name: Send archive through a one-operation restricted SSH receiver
        env:
          UPLOAD_KEY: ${{ secrets.NEURIX_RUNTIME_UPLOAD_KEY }}
          KNOWN_HOSTS: ${{ secrets.NEURIX_RUNTIME_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$UPLOAD_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$UPLOAD_KEY" > "$HOME/.ssh/neurix-runtime"
          chmod 600 "$HOME/.ssh/neurix-runtime"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          mapfile -t archives < <(find runtime -maxdepth 1 -type f -name '*-linux-x64-server.tar.gz')
          test "${#archives[@]}" -eq 1
          sha256sum "${archives[0]}"
          mkdir parts
          split -b 8M -a 3 "${archives[0]}" parts/part-
          printf 'LIST\n' | ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/neurix-runtime" root@101.34.211.31 > uploaded-parts
          find parts -type f -name 'part-*' -print0 | xargs -0 -P 24 -I '{}' bash -c '
            set -euo pipefail
            part="$1"
            name="${part##*/}"
            sum=$(sha256sum "$part" | cut -d " " -f 1)
            if grep -Fqx "$name $sum" uploaded-parts; then exit 0; fi
            size=$(stat -c %s "$part")
            for attempt in 1 2 3 4; do
              if { printf "%s %s %s\n" "$name" "$size" "$sum"; cat "$part"; } | \
                ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
                  -i "$HOME/.ssh/neurix-runtime" root@101.34.211.31; then exit 0; fi
              sleep "$attempt"
            done
            exit 1
          ' _ '{}'
      - name: Remove temporary upload key
        if: always()
        run: rm -f "$HOME/.ssh/neurix-runtime"
