name: Transfer verified Neurix server runtime

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Linux validation run whose server archive should be transferred'
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: neurix-validation-${{ inputs.run_id }}-linux-x64
          path: runtime
      - name: Send archive through a one-operation restricted SSH receiver
        env:
          UPLOAD_KEY: ${{ secrets.NEURIX_RUNTIME_UPLOAD_KEY }}
          KNOWN_HOSTS: ${{ secrets.NEURIX_RUNTIME_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$UPLOAD_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$UPLOAD_KEY" > "$HOME/.ssh/neurix-runtime"
          chmod 600 "$HOME/.ssh/neurix-runtime"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/neurix-runtime"' EXIT
          mapfile -t archives < <(find runtime -maxdepth 1 -type f -name '*-linux-x64-server.tar.gz')
          test "${#archives[@]}" -eq 1
          sha256sum "${archives[0]}"
          mkdir parts
          split -b 8M -a 3 "${archives[0]}" parts/part-
          find parts -type f -name 'part-*' -print0 | xargs -0 -P 16 -I '{}' bash -c '
            set -euo pipefail
            part="$1"
            { printf "%s\n" "${part##*/}"; cat "$part"; } | \
              ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/neurix-runtime" root@101.34.211.31
          ' _ '{}'
