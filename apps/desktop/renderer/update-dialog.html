<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self'">
    <title></title>
    <link rel="stylesheet" href="design-platform.css">
    <link rel="stylesheet" href="update-dialog.css">
    <link rel="stylesheet" href="update-installation.css">
  </head>
  <body class="update-dialog">
    <script src="shell-theme.js"></script>
    <main id="dialog" role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="title" aria-describedby="detail" hidden>
      <header><h1 id="title"></h1><button id="close" class="close" type="button"></button></header>
      <p id="detail"></p>
      <details id="technical-details" hidden>
        <summary id="technical-details-label"></summary>
        <pre id="technical-details-content" tabindex="0"></pre>
      </details>
      <div id="actions"></div>
    </main>
    <section id="installation" class="installation" role="dialog" aria-modal="true" aria-labelledby="installation-title" aria-describedby="installation-detail" tabindex="-1" inert>
      <div class="installation-grid" aria-hidden="true"></div>
      <div class="installation-glow" aria-hidden="true"></div>
      <div class="installation-content">
        <div class="installation-scene" aria-hidden="true">
          <div class="installation-orbit orbit-outer"><i></i></div>
          <div class="installation-orbit orbit-inner"><i></i></div>
          <div class="installation-core"><span class="installation-brand"></span></div>
          <div class="installation-sparks"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="installation-copy" role="status" aria-live="polite">
          <p id="installation-version" class="installation-version"></p>
          <h1 id="installation-title"></h1>
          <p id="installation-detail"></p>
          <div class="installation-activity" aria-hidden="true"><span></span></div>
        </div>
      </div>
    </section>
    <script src="update-dialog.js"></script>
  </body>
</html>
