- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                inputModalities: [text]
              - id: deepseek-v4-pro
                inputModalities: [text]

- id: attachment-local
  name: '@deepseek-ai/dsh-attachment-local'
  config:
    dshHome: !!js process.cwd() + '/.dsh'

- insert:
    - id: image-provider-fixture
      name: ./provider-fixture.mjs
    - id: tool-image-generation
      name: '@deepseek-ai/dsh-tool-image-generation'
      config:
        endpoint: https://images-fixture.invalid/v1/images/generations
        enabled: true
        apiKey: fixture-key
        model: fixture-image-model
