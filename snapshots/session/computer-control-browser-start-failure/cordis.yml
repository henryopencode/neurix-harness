- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash-vision-exp

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- id: attachment-local
  name: '@deepseek-ai/dsh-attachment-local'

- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    defaultPreset: workspace-write

- insert:
    - id: computer-use
      name: '@deepseek-ai/dsh-computer-use'
    - id: browser-use
      name: '@deepseek-ai/dsh-browser-use'
    - id: native-computer-use-fixture
      name: '../computer-use-unified/native-fixture.mjs'
      config:
        browserControl: true
        browserUnavailable: true
